<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SDCB Talk Display</title>
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Talk Display" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    background: #000000;
    color: #FFFFFF;
    transition: background 0.2s ease, color 0.2s ease;
    overflow: hidden;
  }
  #display {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    overflow-y: auto;
  }
  #display p {
    font-weight: 700;
    line-height: 1.25;
    word-break: break-word;
    max-width: 100%;
  }
  #display p.placeholder {
    font-size: 26px;
    font-weight: 500;
    opacity: 0.5;
  }
  #inputWrap { padding: 0 1rem 1rem; }
  #textInput {
    width: 100%;
    min-height: 80px;
    font-size: 20px;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid #F5F5F5;
    background: #1A1A1A;
    color: #FFFFFF;
    resize: vertical;
    font-family: inherit;
  }
  #controls {
    border-top: 1px solid #333;
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  button {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px;
    border-radius: 999px;
    border: 2px solid #F5F5F5;
    background: transparent;
    color: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:active { opacity: 0.6; }
  #listenBtn.listening { background: #D64545; border-color: #D64545; color: #fff; }
  #speakBtn.speaking { background: #2E7D32; border-color: #2E7D32; color: #fff; }
  .theme-light { background: #FFFFFF; color: #000000; }
  .theme-light #textInput { background: #F5F5F5; color: #000; border-color: #1A1A1A; }
  .theme-light #controls { border-top-color: #DDD; }
  .theme-light button { border-color: #1A1A1A; }
  .theme-highvis { background: #000000; color: #FFE600; }
  .theme-highvis button, .theme-highvis #textInput { border-color: #FFE600; }
</style>
</head>
<body class="theme-dark">

<div id="display"><p class="placeholder">Type below, or use your phone keyboard's dictation button, and it appears here.</p></div>

<div id="inputWrap">
  <textarea id="textInput" placeholder="Type here..."></textarea>
</div>

<div id="controls">
  <button id="listenBtn" aria-label="Start listening">🎤 Listen</button>
  <button id="speakBtn" aria-label="Speak the statement aloud">🔊 Speak</button>
  <button id="decreaseBtn" aria-label="Decrease text size">−</button>
  <button id="increaseBtn" aria-label="Increase text size">+</button>
  <button id="themeBtn" aria-label="Change contrast theme">Contrast</button>
  <button id="clearBtn" aria-label="Clear text">Clear</button>
</div>

<script>
  const display = document.getElementById('display');
  const textInput = document.getElementById('textInput');
  const decreaseBtn = document.getElementById('decreaseBtn');
  const increaseBtn = document.getElementById('increaseBtn');
  const themeBtn = document.getElementById('themeBtn');
  const clearBtn = document.getElementById('clearBtn');
  const listenBtn = document.getElementById('listenBtn');
  const speakBtn = document.getElementById('speakBtn');

  let fontSize = 64;
  const themes = ['theme-dark', 'theme-light', 'theme-highvis'];
  let themeIndex = 0;

  function render() {
    const val = textInput.value;
    if (val) {
      display.innerHTML = '<p style="font-size:' + fontSize + 'px">' + escapeHtml(val) + '</p>';
    } else {
      display.innerHTML = '<p class="placeholder">Type below, or use your phone keyboard\'s dictation button, and it appears here.</p>';
    }
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  textInput.addEventListener('input', render);

  decreaseBtn.addEventListener('click', () => {
    fontSize = Math.max(32, fontSize - 8);
    render();
  });

  increaseBtn.addEventListener('click', () => {
    fontSize = Math.min(140, fontSize + 8);
    render();
  });

  themeBtn.addEventListener('click', () => {
    themeIndex = (themeIndex + 1) % themes.length;
    document.body.className = themes[themeIndex];
  });

  clearBtn.addEventListener('click', () => {
    textInput.value = '';
    finalTranscript = '';
    render();
  });

  // Speech recognition (Listen button)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  // Holds everything recognized so far across auto-restarts, so a pause
  // doesn't wipe out what was already said.
  let finalTranscript = '';

  function setListeningUI(isListening) {
    if (isListening) {
      listenBtn.classList.add('listening');
      listenBtn.textContent = '⏹ Stop';
    } else {
      listenBtn.classList.remove('listening');
      listenBtn.textContent = '🎤 Listen';
    }
  }

  // iOS Safari is known to silently stop returning results when
  // continuous:true is used, so it needs the stop/restart-on-pause approach.
  // Everywhere else, continuous:true avoids that restart cycle entirely,
  // which is what was causing the "stops listening after a few seconds of
  // silence" delay/dropout.
  const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  if (SR) {
    recognition = new SR();
    recognition.continuous = !isIOS;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalTranscript += transcript + ' ';
        } else {
          interim += transcript;
        }
      }
      textInput.value = (finalTranscript + interim).trim();
      render();
    };

    recognition.onerror = (event) => {
      // "no-speech" just means a pause — keep listening, don't treat as a real error
      if (event.error === 'no-speech') return;
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        listening = false;
        setListeningUI(false);
        display.innerHTML = '<p class="placeholder">Microphone access was blocked. Check Settings → Safari → Microphone for this site, then tap Listen again.</p>';
        return;
      }
      // Other errors (audio-capture, network, aborted): try to recover silently via onend restart
    };

    recognition.onend = () => {
      if (!listening) {
        setListeningUI(false);
        return;
      }
      restartRecognition();
    };

    // Restart immediately (no artificial delay — that's what caused the
    // noticeable gap where it seemed like the app stopped listening).
    // Only back off if the browser is genuinely still tearing down the
    // previous session (InvalidStateError), and give up after a few tries.
    function restartRecognition(attempt) {
      attempt = attempt || 0;
      if (!listening) return;
      try {
        recognition.start();
      } catch (e) {
        if (e.name === 'InvalidStateError' && attempt < 5) {
          setTimeout(() => restartRecognition(attempt + 1), 100);
        } else {
          listening = false;
          setListeningUI(false);
        }
      }
    }

    listenBtn.addEventListener('click', () => {
      // Don't let the mic pick up the app's own spoken output
      if (synth && synth.speaking) {
        synth.cancel();
      }
      if (listening) {
        listening = false;
        recognition.stop();
        setListeningUI(false);
      } else {
        // Continue from whatever's already typed/dictated instead of wiping it.
        finalTranscript = textInput.value ? textInput.value + ' ' : '';
        try {
          recognition.start();
          listening = true;
          setListeningUI(true);
        } catch (e) {}
      }
    });
  } else {
    listenBtn.textContent = 'Listen (unsupported)';
    listenBtn.disabled = true;
    listenBtn.style.opacity = '0.4';
  }

  // Text-to-speech (Speak button) — vocalizes the current statement for
  // someone who is blind and can't read the display.
  const synth = window.speechSynthesis;

  // Pick the most natural-sounding voice available. Browsers/OSes typically
  // ship one or two higher-quality "Natural"/"Neural"/premium voices among a
  // pile of robotic default ones — prefer those.
  let voices = [];
  function loadVoices() {
    voices = synth.getVoices();
  }
  if (synth) {
    loadVoices();
    if ('onvoiceschanged' in synth) {
      synth.onvoiceschanged = loadVoices;
    }
  }

  function pickVoice() {
    if (!voices.length) loadVoices();
    if (!voices.length) return null;

    const byName = (name) => voices.find(v => v.name === name);
    const preferredNames = [
      'Google US English',
      'Samantha',
      'Microsoft Aria Online (Natural) - English (United States)',
      'Microsoft Jenny Online (Natural) - English (United States)',
      'Microsoft Guy Online (Natural) - English (United States)',
      'Ava', 'Nicky', 'Alex'
    ];
    for (const name of preferredNames) {
      const v = byName(name);
      if (v) return v;
    }

    // Any modern "Natural"/"Neural"/"Premium" voice, English preferred.
    const enhanced = voices.find(v => /natural|neural|premium/i.test(v.name) && v.lang.startsWith('en'))
      || voices.find(v => /natural|neural|premium/i.test(v.name));
    if (enhanced) return enhanced;

    // Fall back to a local (higher quality, on-device) English voice.
    const localEn = voices.find(v => v.lang.startsWith('en') && v.localService);
    if (localEn) return localEn;

    const en = voices.find(v => v.lang.startsWith('en'));
    return en || voices[0];
  }

  function setSpeakingUI(isSpeaking) {
    if (isSpeaking) {
      speakBtn.classList.add('speaking');
      speakBtn.textContent = '⏹ Stop';
    } else {
      speakBtn.classList.remove('speaking');
      speakBtn.textContent = '🔊 Speak';
    }
  }

  if (synth) {
    speakBtn.addEventListener('click', () => {
      // If already speaking, treat the button as a stop control.
      if (synth.speaking) {
        synth.cancel();
        setSpeakingUI(false);
        return;
      }

      const text = textInput.value.trim();
      if (!text) return;

      // Stop listening first so the mic doesn't hear the app talk to itself.
      if (listening) {
        listening = false;
        recognition.stop();
        setListeningUI(false);
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      utterance.pitch = 1;
      const voice = pickVoice();
      if (voice) {
        utterance.voice = voice;
        utterance.lang = voice.lang;
      }
      utterance.onstart = () => setSpeakingUI(true);
      utterance.onend = () => setSpeakingUI(false);
      utterance.onerror = () => setSpeakingUI(false);
      synth.speak(utterance);
    });
  } else {
    speakBtn.textContent = 'Speak (unsupported)';
    speakBtn.disabled = true;
    speakBtn.style.opacity = '0.4';
  }

  // Register service worker for offline use
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
